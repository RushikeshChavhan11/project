<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- ✅ Header -->
    <section class="hero bg-gray-800 text-white text-center py-4">
        <h1 class="text-4xl font-bold">📸 Capturing Attendance</h1>
        <h2 id="subject-title" class="text-xl"></h2>
    </section>

    <!-- ✅ Webcam -->
    <div class="container mx-auto mt-6 text-center">
        <video id="webcam" width="400" height="300" autoplay></video>
        <canvas id="canvas" width="400" height="300" hidden></canvas>
        <button id="capture-button" class="bg-blue-500 text-white px-6 py-2 mt-4 rounded-md hover:bg-blue-600">📷 Capture Attendance</button>
    </div>

    <div id="status-message" class="mt-4 text-center text-lg"></div>

    <script>
        let videoStream;
        let subject = new URLSearchParams(window.location.search).get("subject");
        document.getElementById("subject-title").textContent = `Subject: ${subject}`;

        // ✅ Start Webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                videoStream = stream;
                document.getElementById("webcam").srcObject = stream;
            })
            .catch(error => alert("❌ Webcam access denied."));

        // ✅ Capture Image & Send to Server
        document.getElementById('capture-button').addEventListener('click', () => {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const capturedImage = canvas.toDataURL('image/jpeg');

            fetch('/mark_attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ captured_image: capturedImage, subject_name: subject })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('status-message').textContent = data.message;
                if (data.status === "success") {
                    document.getElementById('status-message').style.color = "green";
                } else {
                    document.getElementById('status-message').style.color = "red";
                }
            })
            .catch(error => console.error("❌ Error:", error));
        });
    </script>

</body>

</html>
