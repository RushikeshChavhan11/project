<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            text-align: center;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }
        h2 {
            font-size: 2rem;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        select, input, button {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .chart-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .chart-container img {
            width: 70%;
            max-width: 700px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px;
            background: white;
        }
    </style>
</head>
<body>
    <header>
        <section class="hero">
            <div style="background-color: #28a745; color: white; padding: 1rem;">
                <h1>QuiickTracker</h1>
            </div>
            <div class="hero-content">
                <h2>📊 Attendance Analysis</h2>
            </div>
        </section>
    </header>

    <!-- ✅ Filters Section -->
    <div class="filters">
        <label for="course_name">Select Course:</label>
        <select id="course_name">
            <option value="">-- Select Course --</option>
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
        </select>

        <label for="year">Select Year:</label>
        <select id="year">
            <option value="">-- Select Year --</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>

        <label for="subject">Select Subject:</label>
        <select id="subject">
            <option value="">-- Select Subject --</option>
        </select>

        <label for="from_date">From Date:</label>
        <input type="date" id="from_date">

        <label for="to_date">To Date:</label>
        <input type="date" id="to_date">

        <label for="total_students">Total Students:</label>
        <input type="number" id="total_students" placeholder="Enter total students" min="1">

        <button onclick="fetchGraph()">Generate Report</button>
    </div>

    <!-- ✅ Bar Graph -->
    <div class="chart-container">
        <img id="barChart" src="" alt="Bar Graph" />
    </div>

    <script>
        // ✅ Fetch Subjects from Backend
        async function fetchSubjects() {
            try {
                const response = await fetch('/get_subjects');
                const subjects = await response.json();
                const subjectDropdown = document.getElementById('subject');

                subjects.forEach(subject => {
                    let option = document.createElement('option');
                    option.value = subject;
                    option.textContent = subject;
                    subjectDropdown.appendChild(option);
                });
            } catch (error) {
                console.error("❌ Error fetching subjects:", error);
            }
        }

        // ✅ Fetch Graph Data from Backend
        async function fetchGraph() {
            const course_name = document.getElementById('course_name').value;
            const year = document.getElementById('year').value;
            const subject = document.getElementById('subject').value;
            const from_date = document.getElementById('from_date').value;
            const to_date = document.getElementById('to_date').value;
            const total_students = document.getElementById('total_students').value;

            if (!subject || !total_students) {
                alert("❌ Please select a subject and enter total students.");
                return;
            }

            try {
                const response = await fetch(`/get_attendance_graph?subject=${subject}&year=${year}&course_name=${course_name}&total_students=${total_students}&from_date=${from_date}&to_date=${to_date}`);
                const data = await response.json();

                if (data.status === "error") {
                    alert(data.message);
                    return;
                }

                // ✅ Set Bar Chart Image Source
                document.getElementById("barChart").src = "data:image/png;base64," + data.bar_chart;
            } catch (error) {
                console.error("❌ Error fetching graph data:", error);
            }
        }

        // ✅ Load Subjects on Page Load
        document.addEventListener("DOMContentLoaded", fetchSubjects);
    </script>

</body>
<!-- Home Button -->
<div style="text-align: right; margin: 10px;">
    <a href="{{ url_for('index') }}" style="text-decoration: none;">
        <button style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer;">
            🏠 Home
        </button>
    </a>
</div>

</html>
