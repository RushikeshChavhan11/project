<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Student - Face Recognition Attendance System</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>
<body class="bg-gray-100 text-gray-800">

    <header>
        <section class="hero">
            <div style="background-color: #28a745; color: white; padding: 1rem;">
                <h1 style="font-size: 5rem; margin: 0;">QuiickTracker</h1>
            </div>
            <div class="hero-content">
                <h1>Automated Face Recognition Attendance</h1>
                <h3>Monitoring System</h3>
            </div>
        </section>
    </header>

    <!-- ✅ Subject Selection -->
    <div class="container mx-auto mt-6 text-center">
        <label for="subject" class="text-lg font-semibold">📚 Select Subject:</label>
        <input type="text" id="subject" class="border p-2 rounded" placeholder="Enter Subject Name">
        <button onclick="openAttendanceWindow()" class="bg-green-500 text-white px-6 py-2 rounded-md hover:bg-green-600">📸 Mark Attendance</button>
    </div>

    <script>
        function openAttendanceWindow() {
            const subject = document.getElementById("subject").value.trim();
            if (!subject) {
                alert("⚠ Please enter a subject before marking attendance.");
                return;
            }
            window.open(`/capture_attendance?subject=${encodeURIComponent(subject)}`, "_blank", "width=800,height=600");
        }
    </script>

</body>
<!-- Home Button -->
<div style="text-align: right; margin: 10px;">
    <a href="{{ url_for('index') }}" style="text-decoration: none;">
        <button style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer;">
            🏠 Home
        </button>
    </a>
</div>

</html>
